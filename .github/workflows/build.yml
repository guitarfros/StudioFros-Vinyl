name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-22.04 }
          - { name: macOS,   os: macos-latest }
          - { name: Windows, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSTUDIOFROS_COPY_AFTER_BUILD=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Show build results
        shell: bash
        run: ls -R build/StudioFrosVinyl_artefacts | head -60

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd build/StudioFrosVinyl_artefacts/Release
          zip -r -y "$GITHUB_WORKSPACE/StudioFros-Vinyl-${{ matrix.name }}.zip" VST3 Standalone

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/StudioFrosVinyl_artefacts/Release/VST3","build/StudioFrosVinyl_artefacts/Release/Standalone" -DestinationPath "StudioFros-Vinyl-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: StudioFros-Vinyl-${{ matrix.name }}
          path: StudioFros-Vinyl-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: StudioFros-Vinyl-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: StudioFros-Vinyl-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
